<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{
    --navy-900:#0b1f33; --navy-800:#0f2942; --navy-700:#173a5e; --line:#28496b;
    --ink:#eaf1f8; --ink-dim:#9db4cc; --field:#0d2137; --field-line:#2f5679;
    --ok:#1f9d55; --accent:#ffb703; --accent-ink:#0b1f33; --radius:10px;
  }
  [data-theme="light"]{
    --navy-900:#f4f6fa; --navy-800:#ffffff; --navy-700:#e4e9f1; --line:#d3dae6;
    --ink:#152233; --ink-dim:#5b6b81; --field:#ffffff; --field-line:#c2ccdb;
    --accent:#f59e00; --accent-ink:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    background:var(--navy-900);color:var(--ink);display:flex;flex-direction:column;height:100vh}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;
    background:var(--navy-800);border-bottom:1px solid var(--line)}
  .head .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;
    background:var(--accent);color:var(--accent-ink);font-weight:800}
  .head h1{font-size:16px;margin:0;font-weight:800}
  .head .sp{margin-left:auto}
  .head select,.head input{min-height:40px;background:var(--field);color:var(--ink);
    border:1px solid var(--field-line);border-radius:8px;padding:6px 10px;font-size:15px}
  .theme-toggle{min-height:40px;padding:0 12px;border:1px solid var(--field-line);
    background:var(--field);color:var(--ink);border-radius:8px;font-weight:700;cursor:pointer}

  .setup{padding:14px;max-width:520px;margin:0 auto;width:100%}
  .setup .card{background:var(--navy-800);border:1px solid var(--line);border-radius:10px;padding:16px}
  .setup label{display:block;font-size:13px;color:var(--ink-dim);margin:10px 0 4px}
  .setup input,.setup select{width:100%;min-height:46px;background:var(--field);color:var(--ink);
    border:1px solid var(--field-line);border-radius:8px;padding:8px 12px;font-size:16px}
  .btn{min-height:48px;padding:0 18px;border:none;border-radius:8px;
    background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:14px}

  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--navy-800);border:1px solid var(--line)}
  .msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .msg .meta{font-size:11px;opacity:.8;margin-bottom:3px}
  .msg .body{font-size:15px;white-space:pre-wrap;word-break:break-word}
  .role-host{border-left:3px solid #6ea8ff}
  .composer{display:flex;gap:8px;padding:10px 14px;background:var(--navy-800);border-top:1px solid var(--line)}
  .composer input{flex:1;min-height:48px;background:var(--field);color:var(--ink);
    border:1px solid var(--field-line);border-radius:8px;padding:8px 12px;font-size:16px}
  .composer button{min-height:48px;padding:0 20px;border:none;border-radius:8px;
    background:var(--accent);color:var(--accent-ink);font-weight:800;cursor:pointer}
  .empty{color:var(--ink-dim);text-align:center;padding:30px}
  .hidden{display:none}
</style>
</head>
<body>

<!-- 初期設定（名前と避難所を入れる） -->
<div id="setup" class="setup">
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span class="mark" style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800">避</span>
      <h1 style="margin:0;font-size:17px">連絡チャット</h1>
    </div>
    <p style="color:var(--ink-dim);font-size:13px">ホストと避難所スタッフの連絡用です。お名前と所属避難所を選んでください。</p>
    <label>お名前</label>
    <input id="setName" placeholder="例：山田">
    <label>所属避難所</label>
    <select id="setShelter"><option value="">読み込み中…</option></select>
    <button class="btn" onclick="enterChat()">チャットを開始</button>
  </div>
</div>

<!-- チャット本体 -->
<div id="chatWrap" class="hidden" style="display:flex;flex-direction:column;height:100vh">
  <div class="head">
    <span class="mark">避</span>
    <h1>連絡チャット</h1>
    <select id="roomSel" onchange="switchRoom()" class="sp"></select>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
  </div>
  <div id="msgs" class="msgs"><div class="empty">読み込み中…</div></div>
  <div class="composer">
    <input id="msgInput" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">送信</button>
  </div>
</div>

<script>
  const TOKEN = 'NAGAOKAKYOU_HINANJYO'; // GAS側 SHARED_TOKEN と一致
  let ME = { name:'', shelter_id:'', shelter_name:'' };
  let currentRoom = '__all__';
  let lastTs = '';
  let poll = null;
  let shelters = [];

  // 起動：避難所リストを取得してセットアップ画面へ
  google.script.run.withSuccessHandler(function(d){
    const sel = document.getElementById('setShelter');
    sel.innerHTML = '<option value="">選択してください</option>';
    shelters = (d && d.byShelter) ? d.byShelter.map(function(s){return {id:s.shelter_id,name:s.shelter_name};}) : [];
    // 履歴に無い避難所も選べるよう、報告済みが無ければ手入力を促す
    shelters.forEach(function(s){
      const o=document.createElement('option'); o.value=s.id; o.textContent=s.id+'：'+(s.name||''); sel.appendChild(o);
    });
    if(!shelters.length){
      const o=document.createElement('option'); o.value='__unknown__'; o.textContent='（未報告：あとで自動表示）'; sel.appendChild(o);
    }
  }).withFailureHandler(function(){
    document.getElementById('setShelter').innerHTML='<option value="__unknown__">避難所</option>';
  }).getDashboard_();

  function enterChat(){
    const name = document.getElementById('setName').value.trim();
    const sel = document.getElementById('setShelter');
    if(!name){ alert('お名前を入力してください'); return; }
    if(!sel.value){ alert('避難所を選んでください'); return; }
    ME.name = name;
    ME.shelter_id = sel.value;
    ME.shelter_name = sel.options[sel.selectedIndex].textContent.replace(/^.*：/,'');
    // ルーム選択肢（全体＋自分の避難所）
    const rs = document.getElementById('roomSel');
    rs.innerHTML = '<option value="__all__">全体</option>' +
      '<option value="'+esc(ME.shelter_id)+'">'+esc(ME.shelter_id)+'：'+esc(ME.shelter_name)+'</option>';
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('chatWrap').classList.remove('hidden');
    initTheme();
    switchRoom();
  }

  function switchRoom(){
    currentRoom = document.getElementById('roomSel').value;
    lastTs = '';
    document.getElementById('msgs').innerHTML = '<div class="empty">読み込み中…</div>';
    fetchMsgs(true);
    if(poll) clearInterval(poll);
    poll = setInterval(function(){ fetchMsgs(false); }, 5000); // 5秒ごと更新
  }

  function fetchMsgs(replace){
    google.script.run.withSuccessHandler(function(res){
      if(!res || !res.ok) return;
      renderMsgs(res.messages, replace);
    }).chatFetchApi({ token:TOKEN, room:currentRoom, since: replace ? '' : lastTs });
  }

  function renderMsgs(list, replace){
    const box = document.getElementById('msgs');
    if(replace){
      if(!list.length){ box.innerHTML='<div class="empty">まだメッセージはありません。</div>'; return; }
      box.innerHTML='';
    }
    list.forEach(function(m){
      lastTs = m.created_at > lastTs ? m.created_at : lastTs;
      const mine = (m.sender===ME.name);
      const div=document.createElement('div');
      div.className='msg'+(mine?' mine':'')+(m.role==='host'?' role-host':'');
      div.innerHTML='<div class="meta">'+esc(m.sender)+(m.role==='host'?'（ホスト）':'')+' ・ '+fmt(m.created_at)+'</div>'+
        '<div class="body">'+esc(m.text)+'</div>';
      box.appendChild(div);
    });
    if(list.length){ box.scrollTop = box.scrollHeight; }
  }

  function sendMsg(){
    const inp=document.getElementById('msgInput');
    const text=inp.value.trim();
    if(!text) return;
    inp.value='';
    google.script.run.withSuccessHandler(function(res){
      if(res && res.ok){ fetchMsgs(false); }
    }).chatPostApi({ token:TOKEN, room:currentRoom, sender:ME.name, role:'shelter', text:text });
  }

  function toggleTheme(){
    const now=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
    const next=now==='light'?'dark':'light';
    applyTheme(next); try{localStorage.setItem('chat_theme',next);}catch(e){}
  }
  function applyTheme(t){
    const b=document.getElementById('themeToggle');
    if(t==='light'){document.documentElement.setAttribute('data-theme','light'); if(b)b.textContent='☀️';}
    else{document.documentElement.removeAttribute('data-theme'); if(b)b.textContent='🌙';}
  }
  function initTheme(){ let s='dark'; try{s=localStorage.getItem('chat_theme')||'dark';}catch(e){} applyTheme(s); }

  function fmt(iso){ if(!iso)return''; const d=new Date(iso); return isNaN(d)?'':
    (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
</script>
</body>
</html>
